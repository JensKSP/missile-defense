#
# The latest build of master, downloadable by anyone, at a URL that never
# changes:
#
#     https://github.com/JensKSP/missile-defense/releases/tag/nightly
#
# Workflow artifacts cannot do this. They expire after 90 days, they are only
# downloadable by someone signed in to GitHub, and their URLs are per-run — so
# they cannot be linked from a README and handed to a stranger. A pre-release on
# a rolling tag can be all three, and being marked pre-release keeps it from ever
# displacing the real "Latest release".
name: Nightly

on:
  schedule:
    # 03:15 UTC. Not on the hour: GitHub's scheduler queues everything written
    # at :00 together, and a nightly is in no hurry.
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  decide:
    # Skip the whole thing when master has not moved. Four platforms of runner
    # time to rebuild a tree that already has a nightly is waste, and it churns
    # the download URLs for no reason.
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      package-version: ${{ steps.derive.outputs.package }}
      deb-version: ${{ steps.derive.outputs.deb }}
      semver: ${{ steps.derive.outputs.semver }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the dev version counts commits, so shallow will not do

      - name: Derive the version
        id: derive
        # One source, four spellings — see tools/version.py. Nothing here
        # hand-writes a version, so two nightlies of one tree cannot disagree.
        run: |
          set -euo pipefail
          {
            echo "package=$(python3 -m tools.version --dev filename)"
            echo "deb=$(python3 -m tools.version --dev debian)"
            echo "semver=$(python3 -m tools.version --dev semver)"
          } >> "$GITHUB_OUTPUT"
          python3 -m tools.version --dev semver

      - name: Has master moved since the last nightly?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous="$(gh release view nightly --json targetCommitish -q .targetCommitish 2>/dev/null || echo none)"
          if [ "$previous" = "$GITHUB_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already built $GITHUB_SHA; nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Previous nightly was at ${previous}; building ${GITHUB_SHA}."
          fi

  build:
    needs: decide
    if: needs.decide.outputs.changed == 'true'
    uses: ./.github/workflows/build.yml
    with:
      package-version: ${{ needs.decide.outputs.package-version }}
      deb-version: ${{ needs.decide.outputs.deb-version }}

  runtime-install:
    # The trainer's managed runtime, installed for real, on all three platforms.
    #
    # Nothing else asks this question. Every other job imports `missile_defense`
    # through the development venv, where bootstrap's `md-checkout.pth` puts
    # `python/` on the path — so the wiring the *managed* runtime depends on can
    # be broken and every one of them still passes. That runtime is a bare venv:
    # PYTHONPATH is its only route to the package, and the health check deciding
    # whether an install counts runs inside it.
    #
    # It went wrong exactly that way: `runtime.PACKAGE_PATH` pointed at the
    # package directory instead of the directory containing it, so every install
    # ended in `No module named 'missile_defense'` — and only after downloading
    # gigabytes of torch, because the pre-flight binding probe runs against the
    # source interpreter and passes.
    #
    # Nightly rather than per-push because it is ~1 GB of torch on three runners.
    # The free half of the question — the same import through the same
    # PACKAGE_PATH, no download — runs on every push in ci.yml's `bootstrap` job.
    #
    # Independent of `decide`: this tests the code, not the artifacts, and is
    # worth running on a night when master has not moved (PyPI, torch and the
    # runner images all move underneath it).
    strategy:
      fail-fast: false # one platform's failure must not hide the other two
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-2022
          - os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Tools the binding needs
        # No Qt and no Vulkan: MD_BUILD_APP and MD_BUILD_TOOLS go off below, so
        # this builds the extension and nothing else. That is the whole reason
        # this job can afford to run on three platforms.
        run: python -m pip install --upgrade pip nanobind numpy

      - uses: lukka/get-cmake@latest

      - name: MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build the binding beside the package
        # `md_native_beside_package` is the target `poe bindings` builds; it puts
        # `_md_native` in python/missile_defense/, which is where PACKAGE_PATH has
        # to point for any of this to work.
        run: |
          cmake -S . -B build/bindings -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMD_BUILD_BINDINGS=ON \
            -DMD_BUILD_APP=OFF \
            -DMD_BUILD_TOOLS=OFF \
            -DBUILD_TESTING=OFF
          cmake --build build/bindings --target md_native_beside_package
        shell: bash

      - name: Install a CPU runtime and health-check it
        # PYTHONPATH so this interpreter can import the package it is about to
        # ask a fresh venv to import — the same route, from the same constant.
        run: python -m tools.runtime_install_check
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/python

  publish:
    needs: [decide, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: incoming

      - name: Lay them out
        # Same shape as release.yml: flatten, put the distribution in each .deb's
        # name because distro builds share package names, and checksum the lot.
        run: |
          set -euo pipefail
          mkdir -p dist
          for deb in incoming/missile-defense-deb-*/*.deb; do
            [ -e "$deb" ] || continue
            slug="$(basename "$(dirname "$deb")")"; slug="${slug#missile-defense-deb-}"
            cp "$deb" "dist/$(basename "$deb" .deb)-${slug}.deb"
          done
          find incoming -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \) \
            -exec cp {} dist/ \;
          # GitHub rewrites `~` in a release asset's name to `.`, so do it here
          # instead of letting it happen after the checksums are taken: otherwise
          # SHA256SUMS lists filenames that do not exist once downloaded and
          # `sha256sum -c` fails on every .deb. Only nightlies contain a `~`. The
          # version *inside* the package keeps its tilde either way, and that is
          # the one apt sorts on.
          for f in dist/*'~'*; do
            [ -e "$f" ] || continue
            mv "$f" "$(printf '%s' "$f" | tr '~' '.')"
          done
          cd dist && sha256sum * > SHA256SUMS
          ls -l

      - name: Move the nightly
        # Delete and recreate rather than edit: the tag has to move to the commit
        # that was actually built, and a release whose tag points somewhere else
        # is a bug report waiting to be filed. --cleanup-tag takes the old tag
        # with it. The URL is unchanged throughout, which is the point.
        env:
          GH_TOKEN: ${{ github.token }}
          SEMVER: ${{ needs.decide.outputs.semver }}
        run: |
          set -euo pipefail
          # printf for the two dynamic values, a *quoted* heredoc for the rest.
          # An unquoted heredoc would run every backtick in that markdown table
          # as a command substitution.
          {
            printf 'Automatic build of `master` — **%s**, commit `%s`.\n\n' \
              "$SEMVER" "$GITHUB_SHA"
            cat <<'NOTES'
          Not a release, and not reviewed. It has passed the same tests every push
          does and nothing more — nobody has played it. Its version sorts *below*
          the release it precedes, so apt and pip both consider it older.

          | Platform | File |
          |---|---|
          | macOS (Apple silicon) | `*-macos-arm64.dmg` |
          | Windows | `*-win64.exe` (installer) or `*-win64.zip` (portable) |
          | **Ubuntu 26.04 LTS** | `*-ubuntu-26.04.deb` |
          | Debian trixie | `*-debian-trixie.deb` |
          | Ubuntu 24.04 LTS (compatibility) | `*-ubuntu-24.04.deb` |

          `SHA256SUMS` covers every file here. For a version someone has looked
          at, use the
          [latest release](https://github.com/JensKSP/missile-defense/releases/latest).
          NOTES
          } > notes.md
          # Update in place; only fall back to creating when there is nothing to
          # update. The previous version deleted first and created second, which
          # guarantees a window with no nightly at all — and on 2026-07-27 the
          # create half returned 403 while the delete half had already
          # succeeded, so the page 404'd until a human noticed. A publish step
          # must never be able to leave the project with less than it started
          # with.
          #
          # `--clobber` replaces assets of the same name; the tag is moved
          # separately below, because that is the one thing `gh release edit`
          # will not do.
          if gh release view nightly >/dev/null 2>&1; then
            git push --force origin "${GITHUB_SHA}:refs/tags/nightly"
            gh release edit nightly \
              --prerelease \
              --title "Nightly — ${SEMVER}" \
              --notes-file notes.md
            gh release upload nightly dist/* --clobber
            # Assets from an older nightly whose filenames carry the previous
            # version would otherwise linger beside the new ones for ever.
            for stale in $(gh release view nightly --json assets \
                             --jq '.assets[].name' | grep -vFf <(cd dist && ls)); do
              gh release delete-asset nightly "$stale" --yes
            done
          else
            gh release create nightly dist/* \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "Nightly — ${SEMVER}" \
              --notes-file notes.md
          fi
