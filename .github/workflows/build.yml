#
# Every shippable artifact, built on the platform it is meant for. Called by
# ci.yml on each push and by release.yml on a tag, so what a release ships is
# byte-for-byte the thing CI has been building all along — not a second recipe
# that drifts from it.
#
# The quality gate is deliberately not here. It judges the source, runs once on
# Linux, and has nothing to say about a tag.
name: Build artifacts

on:
  workflow_call:
    inputs:
      package-version:
        description: >-
          Stamped into package filenames. Empty means the version the tree
          declares, which is what a release wants; a nightly passes its dev
          version so a file called 0.1.0.dmg is never something that is not
          0.1.0.
        type: string
        required: false
        default: ""
      deb-version:
        description: >-
          Upstream version for the .deb, spelled Debian's way (0.1.0~dev128+g…),
          because apt has to sort it below the release it precedes. Empty leaves
          debian/changelog alone.
        type: string
        required: false
        default: ""

jobs:
  macos:
    # There is no macOS container and no supported way to cross-build one, so
    # hosted Apple hardware is the entire macOS story here — see docs/MACOS.md.
    #
    # Deliberately not a second `poe check`: format, lint, types, clang-tidy and
    # coverage all measure the source, not the platform, and the Linux job
    # already holds them. What only this job can prove is that the simulation
    # behaves the same on arm64/libc++ and that the renderer still compiles
    # against MoltenVK — so it runs the tests and builds the app, nothing else.
    runs-on: macos-15
    env:
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v7

      - name: Drop the runner image's unused third-party tap
        # GitHub's macOS image ships `aws/tap`, and Homebrew 4.7 warns on every
        # `brew` invocation that it is ignoring untrusted taps — an annotation on
        # a green job, about a tap nothing here installs from. Untapping is what
        # Homebrew itself suggests, and it is what we mean: this build uses
        # homebrew/core and nothing else.
        #
        # `|| true` because a future image may not ship it, and a missing tap is
        # the state we are asking for.
        run: brew untap aws/tap || true

      - name: Install build dependencies
        # qtbase rather than the `qt` umbrella: the app needs Qt6::Gui alone, and
        # `qt` pulls in WebEngine and three dozen other modules for no gain.
        # Homebrew's qtbase build-depends on molten-vk and vulkan-headers, so it
        # is configured with Vulkan support. molten-vk ships the Metal driver but
        # deliberately no loader, hence vulkan-loader too.
        run: |
          brew install ninja qtbase molten-vk vulkan-headers vulkan-loader \
                       vulkan-tools glslang nlohmann-json

      - name: Install task runner + Python tools
        # numpy because python/tests/test_env.py imports it above its
        # importorskip guard, so without it that file errors instead of skipping.
        # nanobind because the disk image now carries the trainer, and
        # a trainer without the native binding is one that cannot train.
        run: pip3 install --break-system-packages poethepoet pytest numpy nanobind

      - name: Point CMake and the Vulkan loader at Homebrew
        # Homebrew's prefix is not a place CMake or the Vulkan loader look by
        # default (and on Apple Silicon it is /opt/homebrew, not /usr/local).
        run: |
          set -euo pipefail
          brew_prefix="$(brew --prefix)"
          icd="${brew_prefix}/etc/vulkan/icd.d/MoltenVK_icd.json"
          if [ ! -f "$icd" ]; then
            icd="$(brew --prefix molten-vk)/etc/vulkan/icd.d/MoltenVK_icd.json"
          fi
          {
            echo "CMAKE_PREFIX_PATH=$(brew --prefix qtbase):${brew_prefix}"
            # VK_DRIVER_FILES is the current spelling; VK_ICD_FILENAMES is the
            # older one, still honoured. Setting both covers either loader.
            echo "VK_DRIVER_FILES=${icd}"
            echo "VK_ICD_FILENAMES=${icd}"
          } >> "$GITHUB_ENV"
          echo "$(brew --prefix qtbase)/bin" >> "$GITHUB_PATH"

      - name: Report the toolchain
        run: |
          clang++ --version
          cmake --version
          echo "Vulkan ICD: ${VK_DRIVER_FILES}"

      - name: Probe MoltenVK
        # Informational. Whether the runner's paravirtualised GPU enumerates a
        # Vulkan device decides only whether the game could be *run* here; the
        # build and the simulation tests below do not need it.
        continue-on-error: true
        run: vulkaninfo --summary

      - name: Configure without -Werror or -Wpedantic
        # This job builds an artifact; it does not judge the code. Apple Clang is
        # whatever the runner image ships and moves under us, and a new diagnostic
        # from it must not be able to stop the .dmg being built. The Linux gate,
        # on a pinned clang-21, is where zero-warnings is enforced.
        #
        # Set on the cache here rather than in the presets so the poe tasks below
        # inherit it: they re-run `cmake --preset ...`, and since the presets say
        # nothing about these two, the cached values survive the reconfigure.
        env:
          STAMP: ${{ inputs.package-version && format('-DMD_PACKAGE_VERSION={0}', inputs.package-version) || '' }}
        run: |
          cmake --preset debug -DMD_WERROR=OFF -DMD_PEDANTIC=OFF $STAMP
          cmake --preset release -DMD_WERROR=OFF -DMD_PEDANTIC=OFF $STAMP \
            -DMD_BUILD_BINDINGS=ON -DMD_INSTALL_PYTHON_PACKAGE=ON

      - name: C++ tests (Debug + sanitizers)
        run: poe test

      - name: C++ tests (Release)
        run: poe test-release

      - name: Python tests
        run: poe pytest

      - name: Build the disk image
        run: poe dmg

      - name: The image carries two applications, not one
        # macOS has no installer with checkboxes: the disk image is a window
        # with icons in it, and a person drags what they want. So "the trainer
        # is optional" is expressed as a *second .app* — which means the claim
        # to check is that there are two, that they are distinguishable, and
        # that the trainer's one is self-contained (nothing inside a bundle is
        # ever on sys.path, so a payload outside Contents/Resources is a
        # trainer that starts and cannot import itself).
        shell: bash
        run: |
          set -euo pipefail
          # Depth 4, not 3: CPack stages under
          # `_CPack_Packages/<system>/<generator>/<package-name>/`, so the
          # bundles sit one level below where this used to look — it matched
          # nothing, and `test 1 -eq 2` on an empty result is a failure with no
          # output at all, which is a miserable thing to debug.
          staged=$(find build/release/_CPack_Packages -maxdepth 4 -name "*.app" -type d | sort)
          echo "$staged"
          test -n "$staged" || { echo "::error::no .app bundle was staged" >&2; exit 1; }
          # One bundle, not two. There used to be a second, `Missile Defense
          # Trainer.app`, carrying the Python package and a shell wrapper. It is
          # gone: on macOS the trainer is a wheel the game installs with pip, and
          # what starts it afterwards is the interpreter it was installed into.
          test "$(echo "$staged" | wc -l)" -eq 1
          game=$staged
          test -f "$game/Contents/Resources/HOW-TO-TRAIN.html"
          # And no Python inside it at all — the promise the second bundle used
          # to make by being separate is now made by there being nothing to
          # separate.
          if find "$game" -name "*.py" | grep .; then
            echo "::error::the game bundle ships Python sources" >&2
            exit 1
          fi
          if [ -n "${MD_TRAINER_WHEEL:-}" ]; then
            ls "$game/Contents/MacOS/"missile_defense-*.whl || {
              echo "::error::MD_TRAINER_WHEEL was set but no wheel was staged" >&2
              exit 1
            }
          fi

      - name: The game bundle carries the whole Vulkan stack
        # macOS has no Vulkan of its own — not the driver and not the loader —
        # so both have to be *inside* the .app or the disk image only runs on a
        # machine that already has Homebrew, which is nobody who downloads one.
        # Two separate mechanisms put them there and neither announces failure:
        # macdeployqt copies the loader because md_app links it, and
        # deploy_macos.cmake copies MoltenVK by hand because it is dlopened and
        # macdeployqt therefore cannot see it. Until now nothing checked either.
        shell: bash
        run: |
          set -euo pipefail
          app=$(find build/release/_CPack_Packages -maxdepth 4 -name "*.app" -type d | head -1)
          test -n "$app" || { echo "::error::no game bundle was staged" >&2; exit 1; }
          echo "$app"
          ls "$app/Contents/Frameworks"

          # The driver, and the manifest that tells the loader where it went.
          icd="$app/Contents/Resources/vulkan/icd.d/MoltenVK_icd.json"
          test -f "$icd" || { echo "::error::no MoltenVK ICD manifest in the bundle" >&2; exit 1; }
          cat "$icd"
          # Relative, or it points at this runner's Homebrew and the bundle runs
          # nowhere else — which is the failure mode the rewrite exists to stop
          # and the one that looks exactly like success here.
          if ! grep -q '"library_path"[[:space:]]*:[[:space:]]*"\.\./\.\./\.\./Frameworks/' "$icd"; then
            echo "::error::the ICD manifest does not point inside the bundle" >&2
            exit 1
          fi
          driver=$(sed -n 's/.*Frameworks\/\([^"]*\)".*/\1/p' "$icd")
          test -f "$app/Contents/Frameworks/$driver" \
            || { echo "::error::the ICD names $driver, which is not in the bundle" >&2; exit 1; }

          # And the loader, which is a different library and a different bug:
          # MoltenVK ships none, so a bundle with the driver and no libvulkan is
          # still a bundle that cannot open a window.
          ls "$app/Contents/Frameworks/"libvulkan*.dylib \
            || { echo "::error::no Vulkan loader in the bundle" >&2; exit 1; }

          # Nothing in there may still resolve to a Homebrew prefix. otool over
          # the executable and every dylib beside it is what catches a load
          # command macdeployqt did not rewrite — invisible on this machine,
          # fatal on every other.
          leaked=$(otool -L "$app/Contents/MacOS/md_app" "$app/Contents/Frameworks/"*.dylib \
            | grep -E '/(opt|usr/local)/homebrew|/opt/homebrew|/usr/local/Cellar' || true)
          if [ -n "$leaked" ]; then
            echo "::error::the bundle still links against Homebrew:" >&2
            echo "$leaked" >&2
            exit 1
          fi

      - name: Upload the .dmg
        uses: actions/upload-artifact@v7
        with:
          name: missile-defense-dmg
          path: build/release/*.dmg

  windows:
    # The MSYS2 CLANG64 toolchain from docs/WINDOWS.md — the one the Qt app is
    # actually built with here. Not `poe`: the task runner would need pip inside
    # the MSYS2 interpreter, and what it would be running is four cmake commands.
    #
    # Scoped like the macOS job, and for the same reason: the source-level checks
    # live on Linux. What only Windows can show is that the tree still compiles
    # against a third standard library, that the simulation agrees there, and that
    # windeploy.sh can still assemble a bundle that runs without MSYS2 installed.
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          # Neither Catch2 nor miniaudio is packaged for MSYS2 at all, so CMake
          # fetches both — which is what it already does on a developer's machine
          # here, so CI is not taking a different path to get them.
          # No vulkan-validation-layers either: a runtime debugging aid, and CI
          # never opens a window.
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-qt6-base
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-nlohmann-json
            mingw-w64-clang-x86_64-nsis
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-python-pip

      - name: Install nanobind
        # The installer now offers the trainer as a component, and a
        # trainer without the native binding is one that cannot start a run.
        # The CLANG64 interpreter is the one CMake will find, so nanobind has to
        # go into that one and not into the runner's system Python.
        run: pip install --break-system-packages nanobind

      - name: Report the toolchain
        run: |
          clang++ --version
          cmake --version
          python --version

      - uses: actions/setup-python@v6
        # The interpreter the *installed* trainer will actually run on. MSYS2's
        # Python builds the game's half of the tree; nobody who downloads an
        # installer has one, and docs/WINDOWS.md sends people to python.org
        # precisely because that is where the PySide6 and torch wheels are. The
        # trainer component has to carry an extension for that ABI, so this job
        # needs both interpreters.
        id: native-python
        with:
          python-version: '3.13'

      - name: Build the trainer's extension for a native CPython
        # MSVC, against the interpreter above, headless (`win-native`: no Qt, no
        # Vulkan — this builds one shared object). The result is what the
        # installer ships; the MSYS2 build stays as it is and keeps serving
        # ctest. Both are stable-ABI, so both are called `_md_native.pyd` and the
        # substitution downstream is exact.
        #
        # Every interpreter here is named by absolute path, never through PATH.
        # Two Pythons are installed and both `setup-msys2` and `setup-python`
        # prepend to PATH, so which one `python` means depends on step order —
        # and a build that silently used the other one produces exactly the
        # artifact this step exists to stop shipping.
        shell: pwsh
        env:
          NATIVE_PYTHON: ${{ steps.native-python.outputs.python-path }}
        run: |
          & $env:NATIVE_PYTHON -m pip install --upgrade pip nanobind
          # Enter the MSVC environment first. This preset is Ninja, and Ninja
          # takes whatever compiler is on PATH — which in a bare pwsh on this
          # runner is `C:/mingw64/bin/c++.exe`. The extension then built fine and
          # failed to *import*, because a MinGW-linked .pyd wants libstdc++-6 and
          # libwinpthread-1 beside it and a native CPython has neither. "DLL load
          # failed: The specified module could not be found" is what that looks
          # like, and it names nothing.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vs) { throw 'no Visual Studio with the C++ tools on this runner' }
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64'
          cmake --preset win-native "-DPython_EXECUTABLE=$env:NATIVE_PYTHON"
          cmake --build --preset win-native --target _md_native
          $module = Get-ChildItem -Path build/win-native -Recurse -Filter '_md_native*.pyd' |
            Select-Object -First 1
          if (-not $module) { throw 'the native CPython extension was not built' }
          # `.pyd` with no interpreter tag is CPython's limited-API name. A
          # tagged one here means STABLE_ABI silently did not apply, and the
          # trainer would then need this exact minor version on the target
          # machine — which is the bug this whole step exists to close.
          if ($module.Name -ne '_md_native.pyd') {
            throw "expected a stable-ABI _md_native.pyd, got $($module.Name)"
          }
          & $env:NATIVE_PYTHON -c "import sys; sys.path.insert(0, r'$($module.Directory)'); import _md_native; print('native extension imports:', _md_native.__file__)"
          "MD_NATIVE_MODULE=$($module.FullName)" >> $env:GITHUB_ENV

      - name: C++ tests (Debug)
        # The debug preset asks for ASan/UBSan; CMakeLists degrades that to a
        # plain Debug build here, because there is no LeakSanitizer runtime under
        # MinGW. The tests are the point either way.
        #
        # No -Werror or -Wpedantic: this job exists to produce an installer, and
        # MSYS2 rolls its clang forward continuously — a new warning arriving in
        # a pacman update must not be able to stop a release being built. The
        # Linux gate holds the zero-warning line on a pinned compiler.
        env:
          STAMP: ${{ inputs.package-version && format('-DMD_PACKAGE_VERSION={0}', inputs.package-version) || '' }}
        run: |
          cmake --preset debug -DMD_WERROR=OFF -DMD_PEDANTIC=OFF $STAMP
          cmake --build --preset debug
          ctest --preset debug

      - name: C++ tests (Release)
        env:
          STAMP: ${{ inputs.package-version && format('-DMD_PACKAGE_VERSION={0}', inputs.package-version) || '' }}
        run: |
          # Pin the interpreter, or CMake finds the runner's tool-cache CPython
          # through the registry rather than the CLANG64 one this job installed
          # nanobind into — see the note on the nanobind step above. By absolute
          # path since a second interpreter joined the job: `command -v python`
          # answers whichever of the two PATH happens to favour, which is a
          # function of step order rather than of intent.
          cmake --preset release -DMD_WERROR=OFF -DMD_PEDANTIC=OFF $STAMP \
            -DPython_EXECUTABLE="$(cygpath -m /clang64/bin/python.exe)" \
            -DMD_PREBUILT_PYTHON_MODULE="$(cygpath -m "$MD_NATIVE_MODULE")" \
            -DMD_BUILD_BINDINGS=ON -DMD_INSTALL_PYTHON_PACKAGE=ON
          cmake --build --preset release
          ctest --preset release

      - name: Build the installer and the portable ZIP
        # Runs tools/windeploy.sh through the install step, which is the part
        # worth having in CI: it walks the dependency closure of missile-defense.exe and
        # copies every CLANG64 DLL beside it. A missing DLL is invisible on the
        # machine that built it and fatal on any other.
        run: cpack --config build/release/CPackConfig.cmake -B build/release -G "NSIS;ZIP"

      - name: What the installer ships is the game, a wheel and a page
        # The installer has one component now: no Python payload, no `.cmd`
        # launcher, no second application. What TRAIN AI needs is the wheel and
        # the instructions page beside the binary, and the interpreter it uses is
        # the user's — which is why there is nothing here to tick.
        #
        # The negative half is still the one that matters, and it got stricter:
        # not one `.py` in the tree, where before the game component merely had
        # to avoid the trainer's own files.
        shell: msys2 {0}
        run: |
          set -euo pipefail
          rm -rf stage-game
          cmake --install build/release --prefix stage-game --component game
          test -f stage-game/missile-defense.exe
          test -f stage-game/HOW-TO-TRAIN.html
          if find stage-game \( -name "*.py" -o -name "*.cmd" \) | grep .; then
            echo "::error::the installer ships Python sources or a script launcher" >&2
            exit 1
          fi
          # The wheel, by the name app/install.cpp looks for. Only when one was
          # handed to the build — a run without the `wheels` artifact still
          # produces a working installer, it just cannot install the trainer.
          if [ -n "${MD_TRAINER_WHEEL:-}" ]; then
            ls stage-game/missile_defense-*.whl || {
              echo "::error::MD_TRAINER_WHEEL was set but no wheel was staged" >&2
              exit 1
            }
          fi

      - name: Upload the installer and ZIP
        uses: actions/upload-artifact@v7
        with:
          name: missile-defense-windows
          path: |
            build/release/*.exe
            build/release/*.zip

  debian:
    # The package Debian itself would build: debian/ via debhelper, which is the
    # authority for Linux packaging (docs/PACKAGING.md). The gate's `poe deb` is
    # CPack and a different code path entirely — no -Werror, hardening=+all,
    # dh_auto_* rather than cmake --install — so one can break while the other
    # still works. This job is the one that would catch it.
    #
    # In containers rather than on the runner, because "the package this
    # distribution would build" is the whole claim, and it is only true if the
    # compiler and every Build-Depends version are that distribution's own.
    #
    # Ubuntu 26.04 is the primary Ubuntu target: it is the current LTS and can
    # build both binary packages from archive dependencies. Debian trixie
    # remains the Debian authority, and Ubuntu 24.04 remains a compatibility
    # build for users who have not upgraded yet. Noble's default g++ is 13 and
    # has no <print>, so that leg takes the g++-14 fallback and cannot build the
    # nanobind extension from archive packages. Resolute and trixie use their
    # distribution-default compilers and build the complete product.
    #
    # GitHub does not yet offer an ubuntu-26.04 hosted runner. The runner only
    # orchestrates these pinned containers, so ubuntu-latest is correct here:
    # matrix.image, not runs-on, is the environment that produces each package.
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:26.04
            slug: ubuntu-26.04
          - image: debian:trixie
            slug: debian-trixie
          - image: ubuntu:24.04
            slug: ubuntu-24.04
            # `python3-nanobind` reached Debian after 24.04 froze, so the
            # extension cannot be built there from archive packages at all.
            # The game still can, and that is the half this entry is really
            # about — so the Python binaries are profiled out rather than the
            # whole LTS dropped from the matrix.
            profiles: pkg.missile-defense.nopython
    steps:
      - name: Install git
        # The image has none, and without it actions/checkout silently falls back
        # to a REST-API tarball rather than a checkout.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v7

      - name: Install the declared build dependencies
        env:
          DEB_BUILD_PROFILES: ${{ matrix.profiles }}
        # From debian/control itself, so the job cannot drift from what the
        # package claims to need — which is half of what it exists to check.
        # No sudo: a container runs as root, and Rules-Requires-Root: no means
        # dpkg-buildpackage is content either way.
        run: |
          apt-get install -y --no-install-recommends devscripts equivs lintian
          mk-build-deps --install --remove \
            --tool 'apt-get -y --no-install-recommends' debian/control

      - name: Stamp the changelog for a nightly
        # Only when a dev version was passed; a release build leaves the
        # changelog exactly as the tag has it. --force-bad-version because the
        # whole point of `0.1.0~dev128` is that it sorts *below* the `0.1.0-1`
        # already at the top of the file, and dch refuses to go backwards
        # without being told that is deliberate.
        if: inputs.deb-version != ''
        # Explicitly bash: a container step defaults to `sh`, which is dash here,
        # and Ubuntu's dash rejects `pipefail` outright while Debian's accepts it.
        # The same script silently meant two different things on the two images.
        shell: bash
        run: |
          set -euo pipefail
          # The trailer's identity comes from debian/control — the same place
          # tools/release.py takes it for a real release stanza. Inventing one is
          # not cosmetic: lintian rejects a mail host with no TLD outright
          # (bogus-mail-host-in-debian-changelog) and fails the job after the
          # package has already built and tested clean.
          maintainer="$(sed -n 's/^Maintainer: //p' debian/control)"
          # An empty parse would hand dch no identity, it would invent
          # root@<container-id>, and lintian would reject that for the same
          # reason it rejected the last one — four platforms of build later.
          [ -n "$maintainer" ] || { echo "no Maintainer in debian/control" >&2; exit 1; }
          DEBFULLNAME="${maintainer%% <*}"
          DEBEMAIL="${maintainer##*<}"; DEBEMAIL="${DEBEMAIL%>}"
          export DEBFULLNAME DEBEMAIL
          dch --newversion "${{ inputs.deb-version }}-1" --distribution unstable --force-bad-version "Nightly build from ${GITHUB_SHA}."
          head -5 debian/changelog

      - name: Build the package
        # Binary-only: the source format is 3.0 (quilt), which wants an orig
        # tarball a git checkout does not have. dh runs the test suite on the way
        # through, so this covers the packaged build's own ctest run too.
        env:
          DEB_BUILD_PROFILES: ${{ matrix.profiles }}
        run: dpkg-buildpackage -us -uc -b

      - name: Lintian
        # Errors fail the job; warnings and info are printed and do not, because
        # a policy nit should not block a build that installs and runs.
        #
        # Both, not just the game. The trainer is the one most likely to trip a
        # policy check the game cannot: it is the package that installs into the
        # `dist-packages` tree the interpreter shares with the distribution, and
        # it does so without a `python3-*` name, which Debian Python Policy would
        # rather it had (debian/control says why that trade was made).
        run: lintian --fail-on error --display-info ../*.deb

      - name: The two binaries are two different products
        # `test_packaging.py` reads `debian/control` and the `.install` manifests
        # and would catch this promise broken on paper. It cannot catch one
        # broken in the *build*: a stray install() rule, a glob in an `.install`
        # file that matched more than it meant to, or a dependency dpkg-shlibdeps
        # worked out for itself. Only the built archives say what actually ships,
        # and until now nothing looked inside them.
        #
        # The negative half is the one that matters. Someone who wants the game
        # must not be made to install an interpreter, and that promise dies
        # quietly: nobody notices a `.py` file inside a 40 MB package.
        # Skipped where only one product exists: under `nopython` the trainer is
        # not built at all, so "the two are different" has nothing to compare. The half that still applies there — the game
        # ships no Python — is the step below, which runs everywhere.
        if: ${{ !matrix.profiles }}
        shell: bash
        run: |
          set -euo pipefail
          game=$(echo ../missile-defense_*.deb)
          trainer=$(echo ../missile-defense-trainer_*.deb)
          for deb in "$game" "$trainer"; do
            test -f "$deb" || { echo "missing: $deb" >&2; exit 1; }
          done

          contents() { dpkg-deb -c "$1" | awk '$NF !~ /\/$/ {print $NF}' | sed 's|^\./|/|'; }
          contents "$game"    | sort > /tmp/game.list
          contents "$trainer" | sort > /tmp/trainer.list
          for list in game trainer; do
            echo "--- $list ---"; cat "/tmp/$list.list"
          done

          # Nothing Python-shaped in the game. Not the sources, not the
          # launchers, not the trainer's menu entry.
          if grep -Eq '\.(py|pyi|so)$|dist-packages|/missile-defense-trainer$|/missile-defense-train$' /tmp/game.list; then
            echo "::error::the game package ships part of the training half" >&2
            exit 1
          fi
          # ... and no Python in its dependency graph either, which is the same
          # promise one level up: a game that Depends: python3 has brought an
          # interpreter along whatever its file list says.
          relations=$(dpkg-deb -f "$game" Depends Recommends Pre-Depends | tr 'A-Z' 'a-z')
          echo "game relations: $relations"
          for forbidden in missile-defense-trainer pyside torch 'python3 ' 'python3:any'; do
            if [[ "$relations" == *"$forbidden"* ]]; then
              echo "::error::the game package relates to $forbidden" >&2
              exit 1
            fi
          done

          # The positive half: the trainer carries what it is for, including the
          # Python package that used to be a binary of its own.
          grep -q '/usr/bin/missile-defense-trainer$' /tmp/trainer.list
          grep -q 'missile-defense-trainer.desktop$' /tmp/trainer.list
          grep -q 'dist-packages/missile_defense/ui/app.py$' /tmp/trainer.list
          # Stable ABI, by filename. `_md_native.abi3.so` keeps working when the
          # distribution moves its Python a minor version; a `.cpython-313-`
          # name has to be rebuilt in lockstep with it, and until STABLE_ABI was
          # actually wired up that is what shipped. Anchored, not a substring —
          # `_md_native` alone matched the tagged name too, which is how it went
          # unnoticed.
          grep -q 'dist-packages/missile_defense/_md_native\.abi3\.so$' /tmp/trainer.list || {
            echo "::error::the trainer ships no stable-ABI extension:" >&2
            grep '_md_native' /tmp/trainer.list >&2
            exit 1
          }

          # And no file is owned twice — dpkg refuses to install two packages
          # that both claim a path, so this is a broken install, not a nit.
          if comm -12 /tmp/game.list /tmp/trainer.list | grep .; then
            echo "::error::two packages own the same path" >&2
            exit 1
          fi

      - name: The game package carries no Python, on every distribution
        # The promise that does not depend on the Python half being built, so
        # unlike the step above this one runs under `nopython` too — which is
        # the distribution where a stray `install()` rule would be least likely
        # to be noticed, because nothing else there looks at Python at all.
        shell: bash
        run: |
          set -euo pipefail
          game=$(echo ../missile-defense_*.deb)
          test -f "$game"
          contents=$(dpkg-deb -c "$game" | awk '$NF !~ /\/$/ {print $NF}' | sed 's|^\./|/|')
          echo "$contents"
          if grep -Eq '\.(py|pyi|so)$|dist-packages|/missile-defense-trainer$|/missile-defense-train$' <<<"$contents"; then
            echo "::error::the game package ships part of the training half" >&2
            exit 1
          fi
          relations=$(dpkg-deb -f "$game" Depends Recommends Pre-Depends | tr 'A-Z' 'a-z')
          echo "game relations: $relations"
          for forbidden in missile-defense-trainer pyside torch 'python3 ' 'python3:any'; do
            if [[ "$relations" == *"$forbidden"* ]]; then
              echo "::error::the game package relates to $forbidden" >&2
              exit 1
            fi
          done

      - name: A game-only install stays a game-only install
        if: ${{ !matrix.profiles }}
        # Installing the game alone must succeed with dependency checks on — the
        # thing `apt install missile-defense` does — and must leave the machine
        # with no trainer on it. Then adding the trainer must actually put one
        # there. The pair is the claim; either half alone proves nothing.
        shell: bash
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends ../missile-defense_*.deb
          test -x /usr/games/missile-defense
          if command -v missile-defense-trainer >/dev/null; then
            echo "::error::a game-only install left a missile-defense-trainer on the machine" >&2
            exit 1
          fi
          # The other direction, from the same starting point.
          apt-get install -y --no-install-recommends \
            ../missile-defense-trainer_*.deb
          command -v missile-defense-trainer
          python3 -c "import missile_defense, missile_defense.ui; print('md', missile_defense.__version__, 'from', missile_defense.__file__)"

      - name: The installed game starts
        # Everything above proves the *dependencies resolve*. None of it proves
        # the game runs, and the two are further apart than they look: the steps
        # above install with --no-install-recommends, and both the Qt platform
        # plugin (qt6-qpa-plugins) and the Vulkan driver (mesa-vulkan-drivers)
        # reach a normal machine as Recommends of libqt6gui6 and libvulkan1. A
        # container installed that way therefore holds a binary that cannot open
        # a window at all — and every assertion here passed for it.
        #
        # So this is the ordinary `apt install ./missile-defense.deb`, with
        # Recommends on the way apt has them on by default, and then the binary
        # is actually run. Xvfb and lavapipe make that possible with no GPU;
        # they are the *test's* dependencies, installed here rather than
        # declared, because a package must not depend on its own test rig.
        shell: bash
        run: |
          set -euo pipefail
          # Purge first. The step above may already have installed the game
          # without Recommends, and apt does not go back and reconsider them for
          # a package that is already there — so without this the "with
          # Recommends" install would be a no-op and the test would run against
          # exactly the machine it exists to distinguish itself from.
          # `|| true` because on the `nopython` leg nothing has installed the
          # game yet — the step that would have is skipped there by its own
          # profile guard — and apt exits 100 on a package it cannot locate.
          # The purge is a precaution against a *previous* install being left in
          # place, so having nothing to purge is a fine outcome, not a failure.
          apt-get purge -y missile-defense || true
          apt-get install -y ../missile-defense_*.deb
          # `xauth` explicitly: it is a *Recommends* of xvfb, and this line says
          # --no-install-recommends — the very trap this step's comment above is
          # about, sprung on the step's own test rig. Without it xvfb-run dies
          # with "xauth command not found" before the game is ever started.
          apt-get install -y --no-install-recommends xvfb xauth mesa-vulkan-drivers
          # --frames caps the run, --silent keeps ALSA out of a container with no
          # sound card, and --report is the machine-readable account of what the
          # game did. Parsed rather than grepped for: "it printed something and
          # exited 0" is also what a binary that drew nothing would do.
          # Screen size and the search for the JSON line both mirror
          # tests/e2e/harness.py: a default Xvfb screen is smaller than the
          # window this asks for, and the report is not reliably the last line —
          # Qt and the Vulkan loader both write to stdout on the way out.
          report=$(xvfb-run -a --server-args='-screen 0 1280x720x24' \
            /usr/games/missile-defense --frames 90 --silent --report \
            | grep '^{' | tail -1)
          echo "$report"
          python3 - "$report" <<'PY'
          import json, sys
          run = json.loads(sys.argv[1])
          if run.get("frames", 0) < 1:
              sys.exit(f"the installed game rendered no frames: {run}")
          print("the installed game ran", run["frames"], "frames in state", run["state"])
          PY

      - name: The game alone installs, where it is the only package
        # `apt install missile-defense` with dependency checks on. The step
        # above covers this where both packages exist; under `nopython`
        # the game is the whole install story and nothing else would prove it.
        if: ${{ matrix.profiles }}
        shell: bash
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends ../missile-defense_*.deb
          test -x /usr/games/missile-defense

      - name: Collect the package
        # dpkg-buildpackage writes to the parent directory, which is outside the
        # workspace and so out of reach of upload-artifact.
        run: |
          mkdir -p dist
          cp ../*.deb ../*.changes ../*.buildinfo dist/

      - name: Upload the .deb
        uses: actions/upload-artifact@v7
        with:
          # Per distribution. Matrix legs uploading one name produce artifacts
          # that cannot be told apart, and the packages are not interchangeable:
          # each is linked against its distribution's Qt and libstdc++.
          name: missile-defense-deb-${{ matrix.slug }}
          path: dist/*

  wheels:
    # The Python half, as something a person can install rather than compile.
    # Everything else in this file ships a game; this ships the environment an
    # agent trains against, and until now the only route to it was an sdist —
    # which meant `pip install` handed the user a CMake configure, a C++23
    # compiler requirement and a nanobind build on a machine that wanted a NumPy
    # array.
    #
    # One wheel per platform, not per interpreter: the extension is built
    # against CPython's stable ABI, so cp312-abi3 covers every later 3.x. The
    # selection, the manylinux image and the import test all live in
    # pyproject.toml's [tool.cibuildwheel], so this job is only the machines.
    #
    # Native architectures only. Linux aarch64 through QEMU costs roughly an
    # hour per build for a platform nothing here is tested on; when it is worth
    # having, it is one `archs` line plus the QEMU setup step.
    name: wheel (${{ matrix.slug }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            slug: manylinux-x86_64
          - os: macos-15
            slug: macos-arm64
          - os: windows-2022
            slug: win-amd64
    steps:
      - uses: actions/checkout@v7

      - name: Build the wheel
        # No toolchain setup anywhere: the manylinux container ships GCC 14.2
        # and CMake 4.4, macOS runners ship Xcode's Clang, and the Windows
        # runner ships MSVC — each the system compiler CMakeLists.txt now
        # expects to be handed rather than to go looking for.
        uses: pypa/cibuildwheel@v3.2.0

      - name: Upload the wheel
        uses: actions/upload-artifact@v7
        with:
          # Per platform, like the .deb legs: these are not interchangeable.
          name: missile-defense-wheel-${{ matrix.slug }}
          path: wheelhouse/*.whl

  sdist:
    # The fallback the wheels do not cover — CPython 3.11, which predates the
    # stable ABI, and any platform without a wheel above. Built once, on Linux,
    # because an sdist is architecture-independent by definition.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the sdist
        run: pipx run build --sdist

      - name: It must contain the sources CMake needs, not only the Python
        # An sdist that omits the C++ tree installs by failing at configure
        # time, which is a worse outcome than not publishing one — pip prefers
        # it over nothing and the error names a missing CMakeLists, not a
        # packaging mistake.
        shell: bash
        run: |
          set -euo pipefail
          for needed in CMakeLists.txt bindings/CMakeLists.txt core/CMakeLists.txt; do
            tar -tzf dist/*.tar.gz | grep -q "/$needed$" \
              || { echo "::error::sdist is missing $needed"; exit 1; }
          done

      - name: Upload the sdist
        uses: actions/upload-artifact@v7
        with:
          name: missile-defense-sdist
          path: dist/*.tar.gz
