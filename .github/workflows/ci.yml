name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  gate:
    # Follow GitHub's current GA Ubuntu LTS image. The distributable Linux
    # packages are pinned separately in build.yml, including Ubuntu 26.04 now;
    # GitHub has not published a 26.04 hosted-runner label yet.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install LLVM/Clang 21
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y clang-format-21 clang-tidy-21 llvm-21

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            qt6-base-dev qt6-base-dev-tools \
            libvulkan-dev glslang-tools mesa-vulkan-drivers \
            spirv-tools \
            libminiaudio-dev catch2 nlohmann-json3-dev \
            dpkg-dev python3 python3-pip

      - name: Install task runner + Python tools
        # numpy is not optional here: missile_defense.env types its buffer contract with
        # numpy.typing, so without it mypy cannot resolve the annotations and
        # test_env.py fails to import. Held below 2.5 because that release
        # dropped Python 3.11 and writes PEP 695 `type` statements in its stubs,
        # which mypy rejects outright under this project's python_version = 3.11
        # — an error in numpy's own stub file, unfixable from here. Pillow so
        # tools/make_icon.py is really type-checked rather than waved through.
        run: |
          pip install --break-system-packages poethepoet ruff pytest mypy pyright \
                      "numpy<2.5" pillow packaging

      - name: Full quality gate
        # format, lint, types, clang-tidy, tests (Debug + Release), coverage >=80%
        run: poe check

      - name: Build the Debian package
        run: poe deb

      - name: Upload the .deb
        uses: actions/upload-artifact@v7
        with:
          name: missile-defense-deb
          path: build/release/*.deb


  app-e2e:
    # The shipped surfaces, driven in their own processes: the game binary, a
    # real short training run, and the trainer window. Everything else in this
    # file tests code; this job tests the programs, which is where the failures
    # a person meets first actually live (docs/TESTING.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        # xvfb is the load-bearing one: the game is Vulkan, and Qt's `offscreen`
        # platform has no Vulkan support at all, so it needs a real X server —
        # just not one with a monitor. mesa-vulkan-drivers supplies lavapipe, a
        # software device, because a CI runner has no GPU.
        #
        # vulkan-validationlayers is load-bearing in a quieter way, and its
        # absence cost this job all of its Vulkan coverage without ever going
        # red: `QVulkanInstance::setLayers` on a layer the loader does not have
        # is silently ignored, so every VUID assertion passed by finding nothing
        # to fail on. `poe vulkan-runtime` now refuses to run without it rather
        # than reporting a clean renderer nobody checked.
        run: |
          # Clang, because this job builds the `debug` preset and that is a
          # development build — sanitizers and Vulkan validation, the things
          # Clang is preferred for. From apt.llvm.org for the same reason the
          # gate uses it: this runner's Ubuntu is older than the project's
          # minimum Clang. Distribution toolchains are proven by the packaging
          # jobs in build.yml, not here.
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            qt6-base-dev qt6-base-dev-tools \
            libvulkan-dev glslang-tools mesa-vulkan-drivers \
            libminiaudio-dev catch2 nlohmann-json3-dev \
            xvfb vulkan-tools python3 python3-dev python3-pip

      - name: Install a current Vulkan validation layer
        # Not from the distribution: Ubuntu 24.04 packages 1.3.275, whose model
        # of the presentation engine reports ~1000 WRITE_AFTER_READ hazards
        # between the acquire and the render pass's layout transition — while
        # listing, in the same message, the barrier it says is missing. 1.4.309
        # reports none on the same binary and driver. `poe vulkan-runtime`
        # enforces the floor and refuses to run below it, so this is what keeps
        # the job honest rather than merely green (MIN_LAYER_VERSION explains
        # why that is a calibrated instrument and not an allow-list).
        run: |
          set -euo pipefail
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc \
            | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc >/dev/null
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          sudo wget -qO "/etc/apt/sources.list.d/lunarg-vulkan-${codename}.list" \
            "https://packages.lunarg.com/vulkan/lunarg-vulkan-${codename}.list"
          sudo apt-get update
          sudo apt-get install -y vulkan-validationlayers
          dpkg -s vulkan-validationlayers | grep ^Version

      - name: Install the Python halves
        # The CPU torch build: this job trains for seconds on four environments,
        # so a CUDA wheel would be gigabytes downloaded to be ignored.
        run: |
          # `python3-dev` is in the apt list above for the same reason: without
          # the development headers `find_package(Python COMPONENTS
          # Development.Module)` fails outright, `Python_EXECUTABLE` comes back
          # empty and the extension is skipped however many nanobinds are
          # installed. That is what "*this* interpreter ()" in the error meant.
          #
          # nanobind because `test_packages.py` stages the *full* install tree —
          # a second configure with MD_INSTALL_PYTHON_PACKAGE=ON — and a trainer
          # payload without the binding is the thing those tests exist to catch.
          # Configuring that without nanobind is now a hard error rather than a
          # warning, which is how this job found out it never had it.
          pip install --break-system-packages poethepoet pytest "numpy<2.5" PySide6 psutil nanobind
          pip install --break-system-packages torch \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Build the game and the bindings
        # Debug, because that is the build with VK_LAYER_KHRONOS_validation
        # enabled — which is what makes "did it render correctly?" checkable
        # without capturing a single pixel.
        run: |
          cmake --preset debug -DMD_SANITIZE=OFF
          cmake --build --preset debug
          python3 -m tools.build_bindings || pip install --break-system-packages -e .

      - name: Find the software Vulkan driver
        # Named rather than pinned. lavapipe's ICD filename is not stable across
        # mesa releases — it was `lvp_icd.x86_64.json` and is `lvp_icd.json` on
        # newer ones — and when the pinned name stopped existing the loader
        # found no driver at all. Every game test then failed with "no --report
        # line on stdout", which says nothing whatsoever about a missing ICD.
        #
        # Still explicit about *which* driver, which is what the pin was for: a
        # real GPU driver appearing on the image must not silently change what
        # this job tested on. It just has to be found rather than assumed.
        run: |
          set -euo pipefail
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1 || true)
          if [ -z "$icd" ]; then
            echo "::error::no lavapipe ICD found — the game cannot render on this runner" >&2
            ls -la /usr/share/vulkan/icd.d/ || true
            exit 1
          fi
          echo "software Vulkan driver: $icd"
          # Both spellings: VK_DRIVER_FILES is current, VK_ICD_FILENAMES is what
          # older loaders read, and the runner image decides which loader it has.
          {
            echo "VK_DRIVER_FILES=$icd"
            echo "VK_ICD_FILENAMES=$icd"
          } >> "$GITHUB_ENV"

      - name: The game can open Vulkan at all
        # One line of output that turns "everything failed" into "the driver is
        # missing". Without it the first symptom is eighteen unrelated-looking
        # test failures, none of which mentions Vulkan.
        # Informational, and deliberately unable to fail the job: the step above
        # already errors out when there is no ICD. A `head` closing the pipe
        # early must not be the thing that turns the build red.
        continue-on-error: true
        run: xvfb-run -a vulkaninfo --summary 2>&1 | head -20 || true

      - name: Vulkan runtime validation
        # Every rendering scenario under VK_LAYER_KHRONOS_validation with
        # synchronization validation on, failing on any message. Separate from
        # the e2e suite below because it asks a different question: that suite
        # checks the game does the right thing, this one checks it does it in a
        # way the specification defines. There is no allow-list behind it.
        run: poe vulkan-runtime

      - name: Application end-to-end suite
        run: poe test-app

  wheel:
    # `pip install .` end to end: the Python half is packaged by
    # scikit-build-core, which compiles the extension through the same CMake
    # tree, so the way this breaks is a build that succeeds and installs an `md`
    # whose first import fails. Installed into a venv *outside* the checkout and
    # imported from there — from inside it, `python/missile_defense` on the path would make a
    # wheel missing the module look fine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # g++ on purpose: a wheel is compiled by whoever runs `pip install`,
          # on whatever they have, which is the system compiler this proves.
          sudo apt-get install -y cmake ninja-build g++ python3 python3-venv python3-pip

      - name: Build and install the wheel
        run: |
          python3 -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/pip install --quiet build
          /tmp/wheelenv/bin/python -m build --wheel --outdir /tmp/dist .
          /tmp/wheelenv/bin/pip install --quiet /tmp/dist/*.whl

      - name: The environment works from an installed package
        working-directory: /tmp
        run: |
          /tmp/wheelenv/bin/python - <<'PY'
          import numpy as np
          from missile_defense.env import VecEnv
          env = VecEnv(num_envs=4, threads=1)
          print("obs", env.observations.shape, "actions", env.action_count)
          env.step(np.zeros(4, dtype=np.int32))
          PY

      - name: The installed package, driven as a person would
        # The same ground as the two steps above, but as tests rather than as
        # shell — `tests/e2e/test_wheel_install.py` is where the assertions
        # live, and running it here is what stops the two definitions drifting.
        # It is opt-in (MD_WHEEL_E2E) so `app-e2e` does not build a second
        # wheel for the same proof.
        env:
          MD_WHEEL_E2E: "1"
        run: |
          /tmp/wheelenv/bin/pip install --quiet pytest numpy
          /tmp/wheelenv/bin/python -m pytest python/tests/e2e/test_wheel_install.py -m e2e -q

      - name: Both commands explain themselves without their optional half
        working-directory: /tmp
        run: |
          # Neither torch nor PySide6 is installed here, on purpose: what is
          # being checked is that each says so rather than raising out of an
          # import (docs/PACKAGING.md).
          # Asserted as the contract, not as one phrasing. Both shims now answer
          # differently on a PEP 668 interpreter — apt packages and a venv rather
          # than a bare `pip install` — which is *better* advice and which broke
          # a grep for the literal string. What has to hold either way: it names
          # what is missing, and it offers a command.
          ! /tmp/wheelenv/bin/missile-defense-train --updates 1 2>&1 | tee /tmp/train.log
          grep -q "torch" /tmp/train.log
          grep -Eq "(pip|apt) install" /tmp/train.log
          ! /tmp/wheelenv/bin/missile-defense-trainer 2>&1 | tee /tmp/trainer.log
          grep -q "PySide6" /tmp/trainer.log
          grep -Eq "(pip|apt) install" /tmp/trainer.log
          # And never a traceback, which is the failure these replaced.
          ! grep -q "Traceback" /tmp/train.log
          ! grep -q "Traceback" /tmp/trainer.log

  quick-start:
    # The README's own commands, extracted from the page and run on a clean copy
    # of the current Ubuntu LTS. It is the first thing a stranger types and the
    # one page nobody with the packages already installed can see is broken
    # (tools/quickstart.py says which two lines it rewrites and why).
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Tools the README assumes you already have
        run: |
          apt-get update
          apt-get install -y git ca-certificates python3
      - uses: actions/checkout@v7
      - name: Run it
        run: python3 -m tools.quickstart --source "$GITHUB_WORKSPACE"

  bootstrap:
    # `python3 -m tools.bootstrap` is what the README tells a developer to run,
    # and the claim it makes is that the trainer it produces can train. That claim
    # was false for a while and nothing here could see it: every other job pip
    # installs its own dependency list, so the one path a person actually takes
    # was the one path CI never took.
    #
    # What it missed: bootstrap installed the trainer and the gate's tools but not
    # nanobind, so CMake never created the `_md_native` target and `poe bindings`
    # failed with `unknown target`. The visible symptom was two steps away and
    # looked like something else entirely — the trainer's runtime installer
    # downloaded five gigabytes of CUDA torch, health-checked it by importing the
    # binding, found none, and reported the *torch* install as failed.
    #
    # So this runs the documented command and then asks the only question that
    # matters about its result.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          # No compiler installed on purpose: `poe bindings` builds the `release`
          # preset, which takes the system's own compiler, and proving that works
          # on a stock runner is part of what this job is for.
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            qt6-base-dev qt6-base-dev-tools \
            libvulkan-dev glslang-tools \
            libminiaudio-dev catch2 nlohmann-json3-dev \
            python3 python3-pip python3-venv python3-dev

      - name: Bootstrap exactly as the README says to
        run: python3 -m tools.bootstrap

      - name: The venv it made can build the simulation binding
        run: .venv/bin/poe bindings

      - name: And the trainer can import it
        # `hasattr(VecEnv)` rather than a bare import: the health check the
        # runtime installer runs asks the same thing, and a binding that imports
        # but exposes nothing would pass one and fail the other.
        run: |
          .venv/bin/python -c "
          import missile_defense._md_native as native
          assert hasattr(native, 'VecEnv'), 'binding imported but exposes no VecEnv'
          print('binding ok:', native.__file__)
          "

  artifacts:
    # The .dmg, the Windows installer and all three Linux distribution builds,
    # from the same definition release.yml uses. Sharing it is the point: a
    # release cannot ship something CI has never built, and a build fixed for CI
    # is fixed for releases too.
    uses: ./.github/workflows/build.yml
