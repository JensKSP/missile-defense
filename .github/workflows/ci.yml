name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM/Clang 21
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y clang-format-21 clang-tidy-21 llvm-21

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            qt6-base-dev qt6-base-dev-tools \
            libvulkan-dev glslang-tools mesa-vulkan-drivers \
            libminiaudio-dev catch2 \
            dpkg-dev python3 python3-pip

      - name: Install task runner + Python tools
        run: pip install --break-system-packages poethepoet ruff pytest mypy pyright

      - name: Full quality gate
        # format, lint, types, clang-tidy, tests (Debug + Release), coverage >=80%
        run: poe check

      - name: Build the Debian package
        run: poe deb

      - name: Upload the .deb
        uses: actions/upload-artifact@v4
        with:
          name: missile-defense-deb
          path: build/release/*.deb
