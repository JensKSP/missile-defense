# This file is both the dev-tooling config (poe, ruff, mypy, pyright, pytest)
# and the Python package definition.

# The extension is compiled by the same CMake tree the game is, so the build
# backend is scikit-build-core rather than setuptools: `pip install .` has to
# produce an `md` that can actually `import _md_native`, and a pure-Python
# backend would install a package that raises on its first line.
#
# Only the headless half is built — no Qt, no Vulkan, no tests. Someone doing
# `pip install missile-defense` wants the deterministic environment to run an
# agent against; the game is a `.deb`, an installer or a `.dmg`, and asking them
# for a Vulkan SDK to get a NumPy array would be a poor trade.
[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "0.10"
cmake.version = ">=3.25"
# The wheel's `md` is the checkout's `python/md`; CMake adds `_md_native` to it
# through the install rule in bindings/CMakeLists.txt.
wheel.packages = ["python/md"]
build-dir = "build/wheel"
# `wheel.exclude` is applied *after* the CMake install, so a `*.pyd` pattern
# here deletes the module this build just produced and the wheel installs an
# `md` whose first import fails. It is not needed for its intended purpose
# either: the in-place copies beside the sources (docs/WINDOWS.md keeps two ABIs
# there at once) are gitignored, and the packages copy skips them.
wheel.exclude = ["**/__pycache__"]
sdist.exclude = ["**/*.pyd", "**/*.so", "**/__pycache__", "build/", "runs/"]

[tool.scikit-build.cmake.define]
MD_BUILD_APP = "OFF"
MD_BUILD_BINDINGS = "ON"
# The CLI tools use <print> (libstdc++ 14); a wheel is compiled on the installer's
# own compiler — g++-13 on Ubuntu 24.04 has no <print> — and the wheel ships only
# _md_native, so there is nothing to gain by building them and a build to lose.
MD_BUILD_TOOLS = "OFF"
BUILD_TESTING = "OFF"
# A wheel is built by whoever installs it, on whatever compiler they have. The
# quality gate is where warnings are errors; a new compiler must not turn a
# `pip install` into a failure.
MD_WERROR = "OFF"
MD_PEDANTIC = "OFF"

[project]
name = "missile-defense"
version = "0.1.0"
description = "Faithful Atari Missile Command clone — game + RL environment"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Jens Köhler", email = "jens@koehler-speyer.de" }]
requires-python = ">=3.11"
# md.env types its buffer contract with numpy.typing, so this is not optional
# for anything that imports the environment at all.
dependencies = ["numpy>=1.24"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment :: Arcade",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/JensKSP/missile-defense"
Source = "https://github.com/JensKSP/missile-defense"

# Never hard dependencies, for the reasons in docs/PACKAGING.md: torch is a
# multi-gigabyte vendor wheel that Debian's own copy would duplicate, and PySide6
# is LGPLv3 while this is MIT. Both are checked for at run time and explained
# when absent, rather than being required by anyone who only wants the
# environment.
[project.optional-dependencies]
train = ["torch"]
console = [
  "PySide6",
  "psutil",
  "nvidia-ml-py",
  "amdsmi; platform_system == 'Linux'",
]

# Both go through a shim that checks for the optional half first: an entry point
# that dies inside `import torch` reads as a broken install rather than as a
# package someone has not added yet (md.cli, md.ui.__main__).
[project.scripts]
md-train = "md.cli:train"
md-console = "md.ui.__main__:main"
md-multiseed = "md.multiseed:main"

# ---- Task runner (poe) -------------------------------------------------------
# Run with: poe <task>   (after `python3 -m tools.bootstrap`)
[tool.poe.tasks]
# Dev-workflow tasks are plain, cross-platform Python (see tools/) — no shell.
# --- Build (build auto-configures; tests/tidy auto-build — one-command TDD) ---
configure         = { cmd = "cmake --preset debug", help = "Configure the Debug build" }
configure-release = { cmd = "cmake --preset release", help = "Configure the Release build" }
build     = { cmd = "cmake --build --preset debug", deps = ["configure"], help = "Build (Debug + sanitizers)" }
release   = { cmd = "cmake --build --preset release", deps = ["configure-release"], help = "Build RelWithDebInfo (-O2, NDEBUG)" }
rebuild   = { sequence = ["clean", "build"], help = "Clean reconfigure + build" }
clean     = { cmd = "python -m tools.quality clean", help = "Remove the build directory" }
app       = { cmd = "python -m tools.run_app", deps = ["release"], help = "Build + run the app (xcb on Linux, so it's screenshot/record-able)" }
eval      = { cmd = "python -m tools.run_eval", deps = ["release"], help = "Benchmark the scripted baseline (M4) over the canonical seed set" }
bench     = { cmd = "python -m tools.run_bench", deps = ["release"], help = "Throughput benchmark: how many sims/s does this machine run?" }
profile   = { cmd = "python -m tools.run_bench --profile", help = "Benchmark with per-phase timers (builds the 'profile' preset)" }
# Both go through tools.launch, which picks an interpreter that has torch /
# PySide6 rather than whichever python is first on PATH — see its docstring.
train     = { cmd = "python -m tools.launch md.train", help = "Train a policy with PPO (needs torch; see docs/TRAINING.md)" }
ui        = { cmd = "python -m tools.launch md.ui", help = "Training console: watch a run's curves and replays (needs PySide6)" }
bindings  = { cmd = "python -m tools.build_bindings", help = "Build the Python extension (_md_native) and put it beside the package" }
shot      = { cmd = "python -m tools.capture screenshot", help = "Screenshot the running app -> shot.png (append --launch to spawn one)" }
rec       = { cmd = "python -m tools.capture record", help = "Record the running app -> clip.mp4 (append --launch to spawn one)" }
contact   = { cmd = "python -m tools.capture frames", help = "Contact-sheet PNG from a video, e.g. `poe contact clip.mp4`" }

# --- Tests (the TDD inner loop is just: `poe test-unit`) ---
test         = { cmd = "ctest --preset debug", deps = ["build"], help = "Run all C++ tests (unit + e2e), Debug" }
test-unit    = { cmd = "ctest --preset debug -L unit", deps = ["build"], help = "Run fast C++ unit tests only" }
test-e2e     = { cmd = "ctest --preset debug -L e2e", deps = ["build"], help = "Run C++ end-to-end tests only" }
test-release = { cmd = "ctest --preset release", deps = ["release"], help = "Build + run all tests in Release (-O2, NDEBUG)" }
pytest       = { cmd = "pytest -m 'not e2e'", help = "Run Python tests (fast; excludes the e2e suite)" }
# Drives the real binaries in their own processes: the game into a virtual X
# server nobody sees, a real short training run, the console offscreen. Minutes,
# not seconds, which is why it is its own task and not part of `poe pytest`.
test-app     = { cmd = "pytest -m e2e", deps = ["build"], help = "Run the application end-to-end tests (slow; needs xvfb for the game)" }
test-all     = { sequence = ["test", "test-release", "pytest"], help = "Run every test in Debug and Release" }

# --- Quality gates (C++) ---
format       = { cmd = "python -m tools.quality format", help = "clang-format all C++ sources" }
format-check = { cmd = "python -m tools.quality format-check", help = "Fail if any C++ is unformatted" }
tidy         = { cmd = "python -m tools.quality tidy", deps = ["build"], help = "clang-tidy core + app (warnings = errors)" }
coverage     = { cmd = "python -m tools.coverage 80", help = "Measure md::core line coverage; fail if below 80%" }
# Vulkan correctness, split by what it costs to ask. `vulkan-shaders` needs no
# GPU, display or build and runs in `check`; `vulkan-runtime` starts the debug
# game under the validation layer across every rendering scenario and runs in
# `check-all`. There is no allow-list behind either (docs/TESTING.md).
vulkan-shaders = { cmd = "python -m tools.vulkan_check shaders", help = "spirv-val every embedded shader against the declared Vulkan target" }
vulkan-runtime = { cmd = "python -m tools.vulkan_check runtime", deps = ["build"], help = "Run the game under VK_LAYER_KHRONOS_validation + sync validation; any message fails" }
vulkan-check   = { sequence = ["vulkan-shaders", "vulkan-runtime"], help = "Both Vulkan gates (docs/TESTING.md)" }
deb          = { cmd = "cpack --config build/release/CPackConfig.cmake -B build/release -G DEB", deps = ["release"], help = "Build a .deb into build/release/ (needs dpkg-dev)" }
dmg          = { cmd = "cpack --config build/release/CPackConfig.cmake -B build/release -G DragNDrop", deps = ["release"], help = "Build a .dmg into build/release/ (macOS; needs macdeployqt)" }
version      = { cmd = "python -m tools.version", help = "Check CMakeLists/pyproject/changelog agree; `--dev semver|pep440|debian|filename` prints the nightly version" }
bump         = { cmd = "python -m tools.release", help = "Set the release version in all three files, then --commit / --tag / --push (docs/RELEASING.md)" }

# --- Quality gates (Python) ---
lint       = { cmd = "ruff check python tools", help = "Ruff lint the Python code" }
format-py  = { cmd = "ruff format python tools", help = "Ruff-format the Python code" }
fmt-py-chk = { cmd = "ruff format --check python tools", help = "Fail if any Python is unformatted" }
mypy       = { cmd = "mypy", help = "mypy strict" }
pyright    = { cmd = "pyright", help = "pyright strict" }
typecheck  = { sequence = ["mypy", "pyright"], help = "Static type-check (mypy + pyright, strict)" }

# --- Aggregate gates ---
check = { sequence = [
  "format-check", "fmt-py-chk", "lint", "typecheck",
  "tidy", "vulkan-shaders", "test", "test-release", "pytest", "coverage",
], help = "Full local CI gate — Debug + Release, tests, coverage ≥80%, zero warnings" }

# The gate plus the application end-to-end suite. Separate from `check` because
# it is minutes rather than seconds and because the game half needs a virtual X
# server; CI runs this one, and it is what to run before a release.
check-all = { sequence = ["check", "vulkan-runtime", "test-app"], help = "The full gate plus Vulkan runtime validation and the application e2e suite" }

install-hooks = { cmd = "python -m tools.hooks install", help = "Install the git pre-commit quality hook" }

# ---- Ruff (Python lint + format) --------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# ---- mypy (strict static typing) --------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["python/md", "tools"]
strict = true

# torch is optional and has no MSYS2/MinGW wheel, so the training modules cannot
# be checked on every machine the rest of the tree is checked on.
[[tool.mypy.overrides]]
module = ["torch", "torch.*"]
ignore_missing_imports = true

# Pillow is a build-time dependency of one icon script and of nothing that ships,
# so it is not installed on every machine that runs the gate — the same treatment
# torch and PySide6 get above, and for the same reason.
[[tool.mypy.overrides]]
module = ["PIL", "PIL.*"]
ignore_missing_imports = true

# numpy is deliberately *not* overridden here. `md.env` types its buffer
# contract with `numpy.typing`, and waving that through would silently drop the
# checking this project most depends on.
#
# It does constrain the environment: numpy >= 2.5 dropped Python 3.11 and writes
# PEP 695 `type` statements in its own stubs, which mypy parses only when
# targeting 3.12+ — so `python_version = "3.11"` above and a 2.5 numpy in the
# same virtualenv fail inside a stub file nothing here can edit. `numpy<2.5` is
# therefore a *typing* requirement, not only a runtime one, and
# `tools/bootstrap.py` and CI both install it.

[[tool.mypy.overrides]]
module = ["md.auxiliary", "md.ppo", "md.train"]
ignore_errors = true

# The console is optional (LGPLv3, never a dependency of the game), so PySide6 is
# not installed on every machine that runs the gate — including CI. Its Qt-free
# half is checked everywhere; the two widget modules are checked where PySide6
# exists, with `pyright --pythonpath <interpreter that has it>`.
[[tool.mypy.overrides]]
module = ["PySide6", "PySide6.*"]
ignore_missing_imports = true

#
# **Every module under `md.ui` that imports PySide6 belongs in this list**, and
# `python/tests/test_typing_policy.py` fails if one is missing. It was a hand-kept
# enumeration for a while and drifted: `analysis`, `library`, `league` and
# `storage` arrived without being added, and because the failure only appears
# where PySide6 is *absent*, every developer machine stayed green while CI went
# red for days. The test is the fix; the list is just data now.
[[tool.mypy.overrides]]
module = [
  "md.ui.__main__",
  "md.ui.about",
  "md.ui.analysis",
  "md.ui.app",
  "md.ui.charts",
  "md.ui.config",
  "md.ui.forms",
  "md.ui.league",
  "md.ui.library",
  "md.ui.meters",
  "md.ui.model",
  "md.ui.runtime_dialog",
  "md.ui.storage",
]
ignore_errors = true

# ---- pyright (strict static typing) -----------------------------------------
[tool.pyright]
include = ["python/md", "tools"]
# `md` lives under python/, which is a source root for the package itself but
# not something pyright infers when checking a script in tools/ that imports it.
extraPaths = ["python"]
# See the mypy note above: without torch installed these degrade to Unknown, so
# they are checked on a machine that has it rather than pretended to be clean.
#
# mypy needs no such list — `ignore_missing_imports` on `torch.*` above covers
# it — but pyright has no per-module equivalent, so the files are named here and
# `tests/test_typing_policy.py` keeps the naming honest. `export_policy.py` was
# missing for weeks and nobody saw it: the errors only appear where torch is
# absent, and the one environment like that is CI.
ignore = [
  "python/md/auxiliary.py",
  "python/md/export_policy.py",
  "python/md/ppo.py",
  "python/md/train.py",
  # Same reason, one layer out: PySide6 is optional, so the widgets are checked
  # on a machine that has it (`pyright --pythonpath ...`), not pretended clean.
  # Kept in step with the mypy list above by `tests/test_typing_policy.py`.
  "python/md/ui/__main__.py",
  "python/md/ui/about.py",
  "python/md/ui/analysis.py",
  "python/md/ui/app.py",
  "python/md/ui/charts.py",
  "python/md/ui/config.py",
  "python/md/ui/forms.py",
  "python/md/ui/league.py",
  "python/md/ui/library.py",
  "python/md/ui/meters.py",
  "python/md/ui/model.py",
  "python/md/ui/runtime_dialog.py",
  "python/md/ui/storage.py",
]
pythonVersion = "3.11"
typeCheckingMode = "strict"

# ---- pytest ------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["python/tests"]
# The root as well as the package, so `tools` — the developer tooling, which has
# discovery logic of its own — is testable rather than only type-checked.
pythonpath = ["python", "."]
addopts = "-q"
# e2e tests start real processes — the game, a trainer, the console — so they
# are minutes rather than seconds and are not part of the inner loop.
# `poe pytest` stays fast; `poe test-e2e-app` runs these; the gate runs both.
markers = ["e2e: drives a shipped binary in its own process (slow)"]
