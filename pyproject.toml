# This file is both the dev-tooling config (poe, ruff, mypy, pyright, pytest)
# and the Python package definition.

# The extension is compiled by the same CMake tree the game is, so the build
# backend is scikit-build-core rather than setuptools: `pip install .` has to
# produce a `missile_defense` that can actually `import _md_native`, and a pure-Python
# backend would install a package that raises on its first line.
#
# Only the headless half is built — no Qt, no Vulkan, no tests. Someone doing
# `pip install missile-defense` wants the deterministic environment to run an
# agent against; the game is a `.deb`, an installer or a `.dmg`, and asking them
# for a Vulkan SDK to get a NumPy array would be a poor trade.
[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "0.10"
cmake.version = ">=3.25"
# The wheel's `missile_defense` is the checkout's `python/missile_defense`; CMake
# adds `_md_native` to it
# through the install rule in bindings/CMakeLists.txt.
wheel.packages = ["python/missile_defense"]
# Per wheel tag, not one shared directory. cibuildwheel builds every selected
# target in sequence inside one job — on Windows that is cp312-win32 *and*
# cp312-win_amd64 — and a fixed path hands the second build the first one's CMake
# cache. It fails as `CMake Error: Error: generator platform: x64` from inside
# FetchContent, which names neither the cache nor the architecture that set it.
# Linux and macOS each build one architecture per job, so this only ever showed
# up on Windows.
build-dir = "build/wheel/{wheel_tag}"
# `wheel.exclude` is applied *after* the CMake install, so a `*.pyd` pattern
# here deletes the module this build just produced and the wheel installs an
# `missile_defense` whose first import fails. It is not needed for its intended purpose
# either: the in-place copies beside the sources (docs/WINDOWS.md keeps two ABIs
# there at once) are gitignored, and the packages copy skips them.
wheel.exclude = ["**/__pycache__"]
# Tag the wheel for the stable ABI. Without this the object inside is
# `_md_native.abi3.so` — nanobind's STABLE_ABI does its half correctly — while
# the *filename* says cp312-cp312, so pip installs it on 3.12 and refuses it on
# 3.13, which is the whole benefit thrown away at the last step. Verified by the
# filename: cp312-abi3, not cp312-cp312.
wheel.py-api = "cp312"
# `.venv` is not housekeeping in this list, it is the load-bearing entry: without
# it the sdist walks the development virtualenv and tries to pack site-packages —
# thousands of files, every compiled extension belonging to another project, and
# a build that reads (and can destroy) the environment it is being run from. It
# went unnoticed while nothing built an sdist here; the moment cibuildwheel did,
# it swept up the venv on its first run.
#
# **Anchored, every one of them.** `runs/` used to be here unanchored and meant
# the training-output directory at the root — until the package gained a layer
# called `missile_defense/runs/`, which the same pattern then matched. The sdist
# lost it, `python -m build` builds the wheel *from the sdist*, and the wheel
# shipped a package whose second import fails. Nothing in the tree could see it:
# the checkout has the directory, so only an install from the artifact does.
sdist.exclude = [
  "**/*.pyd",
  "**/*.so",
  "**/__pycache__",
  "/.venv/",
  "/.git/",
  "/build/",
  "/runs/",
]

[tool.scikit-build.cmake.define]
MD_BUILD_APP = "OFF"
MD_BUILD_BINDINGS = "ON"
# The CLI tools use <print> (libstdc++ 14); a wheel is compiled on the installer's
# own compiler — g++-13 on Ubuntu 24.04 has no <print> — and the wheel ships only
# _md_native, so there is nothing to gain by building them and a build to lose.
MD_BUILD_TOOLS = "OFF"
BUILD_TESTING = "OFF"
# A wheel is built by whoever installs it, on whatever compiler they have. The
# quality gate is where warnings are errors; a new compiler must not turn a
# `pip install` into a failure.
MD_WERROR = "OFF"
MD_PEDANTIC = "OFF"

# ---- Built wheels ------------------------------------------------------------
# Until now the only way to install this was from an sdist, which made every
# `pip install` compile the extension — CMake, a C++23 compiler and nanobind, on
# a machine whose owner wanted a NumPy array. cibuildwheel produces the binaries
# instead, in the `wheels` job of .github/workflows/build.yml — beside every
# other shippable artifact rather than in a workflow of its own.
[tool.cibuildwheel]
# One wheel per platform rather than one per interpreter. `nanobind_add_module`
# asks for STABLE_ABI (bindings/CMakeLists.txt), so what comes out is tagged
# cp312-abi3 and loads on 3.12, 3.13 and every later 3.x — the advantage of the
# stable ABI, already paid for and until now only spent on the .deb surviving a
# distribution's Python upgrade.
#
# CPython 3.12 is where the stable ABI starts, and nanobind silently falls back
# to a version-tagged module below it. `requires-python` is 3.11, so 3.11 keeps
# what it has always had: the sdist. Building a second, version-tagged wheel for
# it is one line if that stops being good enough.
build = "cp312-*"
# musl is left out rather than forgotten: nothing here has been built against it
# and an untested wheel is worse than no wheel, because pip will prefer it. The
# same argument retires 32-bit Windows: `cp312-*` selected win32 as well as
# win_amd64, nothing in this project has ever been built or run there, and the
# game it belongs to is x64 only. It cost more than a wasted build — two targets
# in one job is what exposed the shared build directory above, and it left the
# packaging job with two wheels where it expected one.
skip = "*-musllinux_* *-win32"
# The default manylinux image is manylinux2014, whose GCC is far too old for
# C++23. 2_28 ships GCC 14.2 and CMake 4.4 — verified, not assumed — which is
# exactly the floor CMakeLists.txt asks for.
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
# The one claim a wheel has to earn: that it imports on a machine that never had
# the toolchain. `missile_defense.sim.env` is the module the extension exists for, so importing
# the package alone would not prove the .so loads.
test-command = "python -c \"import missile_defense, missile_defense.sim.env; print(missile_defense.__version__)\""

# macOS builds against 14.0 — CMakeLists.txt sets CMAKE_OSX_DEPLOYMENT_TARGET —
# and cibuildwheel otherwise tags the wheel 11.0 and hands it to delocate, which
# refuses with "Library dependencies do not satisfy target MacOS version 11.0".
# The two numbers have to be one number, and this is the half that was missing.
[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "14.0"

[project]
name = "missile-defense"
version = "0.1.0"
description = "Faithful Atari Missile Command clone — game + RL environment"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Jens Köhler", email = "jens@koehler-speyer.de" }]
requires-python = ">=3.11"
# missile_defense.sim.env types its buffer contract with numpy.typing, so this is not optional
# for anything that imports the environment at all.
dependencies = ["numpy>=1.24"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment :: Arcade",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/JensKSP/missile-defense"
Source = "https://github.com/JensKSP/missile-defense"

# Never hard dependencies, for the reasons in docs/PACKAGING.md: torch is a
# multi-gigabyte vendor wheel that Debian's own copy would duplicate, and PySide6
# is LGPLv3 while this is MIT. Both are checked for at run time and explained
# when absent, rather than being required by anyone who only wants the
# environment.
[project.optional-dependencies]
train = ["torch"]
trainer = [
  "PySide6",
  "psutil",
  "nvidia-ml-py",
  "amdsmi; platform_system == 'Linux'",
]

# Both go through a shim that checks for the optional half first: an entry point
# that dies inside `import torch` reads as a broken install rather than as a
# package someone has not added yet (missile_defense.training.cli, missile_defense.ui.__main__).
#
# The names are the product's, not the import package's. `md-` meant nothing to
# anyone who had not read the source: the game installs as `missile-defense`, so
# the tools that come with it are `missile-defense-*` and a user can find them by
# typing the only name they were ever shown.
#
# There is no separate multi-seed command. It was `md-multiseed`, and it is now
# `missile-defense-train --multiseed`, because it is the trainer run several
# times rather than a different program — see missile_defense.training.cli.train.
[project.scripts]
missile-defense-train = "missile_defense.training.cli:train"
missile-defense-trainer = "missile_defense.ui.__main__:main"

# ---- Task runner (poe) -------------------------------------------------------
# Run with: poe <task>   (after `python3 -m tools.bootstrap`)
[tool.poe.tasks]
# Dev-workflow tasks are plain, cross-platform Python (see tools/) — no shell.
# --- Build (build auto-configures; tests/tidy auto-build — one-command TDD) ---
configure         = { cmd = "cmake --preset debug", help = "Configure the Debug build" }
configure-release = { cmd = "cmake --preset release", help = "Configure the Release build" }
build     = { cmd = "cmake --build --preset debug", deps = ["configure"], help = "Build (Debug + sanitizers)" }
release   = { cmd = "cmake --build --preset release", deps = ["configure-release"], help = "Build RelWithDebInfo (-O2, NDEBUG)" }
rebuild   = { sequence = ["clean", "build"], help = "Clean reconfigure + build" }
clean     = { cmd = "python -m tools.quality clean", help = "Remove the build directory" }
app       = { cmd = "python -m tools.run_app", deps = ["release"], help = "Build + run the app (xcb on Linux, so it's screenshot/record-able)" }
eval      = { cmd = "python -m tools.run_eval", deps = ["release"], help = "Benchmark the scripted baseline (M4) over the canonical seed set" }
bench     = { cmd = "python -m tools.run_bench", deps = ["release"], help = "Throughput benchmark: how many sims/s does this machine run?" }
profile   = { cmd = "python -m tools.run_bench --profile", help = "Benchmark with per-phase timers (builds the 'profile' preset)" }
# Both go through tools.launch, which picks an interpreter that has torch /
# PySide6 rather than whichever python is first on PATH — see its docstring.
#
# `train` builds the extension first, for the same reason `app` builds the game:
# a task that runs something builds what it runs. It cannot start without
# `missile_defense._md_native` at all, so the alternative is a failure several seconds later
# naming a target the reader then has to know to build.
#
# `ui` deliberately does not, and the difference is not an oversight. The
# trainer without the extension still starts, browses runs and plays replays —
# only *starting* a run needs it, and it says so itself at the moment you press
# Start. Making the build a hard dependency would mean that on a machine with no
# C++ toolchain — a Windows box without MSVC, say — `poe ui` stopped opening a
# trainer that would have worked, in order to build something the person may not
# have come for.
train     = { cmd = "python -m tools.launch missile_defense.training.train", deps = ["bindings"], help = "Train a policy with PPO (needs torch; see docs/TRAINING.md)" }
ui        = { cmd = "python -m tools.launch missile_defense.ui", help = "Trainer: watch a run's curves and replays (needs PySide6)" }
bindings  = { cmd = "python -m tools.build_bindings", help = "Build the Python extension (_md_native) and put it beside the package" }
shot      = { cmd = "python -m tools.capture screenshot", help = "Screenshot the running app -> shot.png (append --launch to spawn one)" }
rec       = { cmd = "python -m tools.capture record", help = "Record the running app -> clip.mp4 (append --launch to spawn one)" }
contact   = { cmd = "python -m tools.capture frames", help = "Contact-sheet PNG from a video, e.g. `poe contact clip.mp4`" }

# --- Tests (the TDD inner loop is just: `poe test-unit`) ---
test         = { cmd = "ctest --preset debug", deps = ["build"], help = "Run all C++ tests (unit + e2e), Debug" }
test-unit    = { cmd = "ctest --preset debug -L unit", deps = ["build"], help = "Run fast C++ unit tests only" }
test-e2e     = { cmd = "ctest --preset debug -L e2e", deps = ["build"], help = "Run C++ end-to-end tests only" }
test-release = { cmd = "ctest --preset release", deps = ["release"], help = "Build + run all tests in Release (-O2, NDEBUG)" }
pytest       = { cmd = "pytest -m 'not e2e'", help = "Run Python tests (fast; excludes the e2e suite)" }
# Drives the real binaries in their own processes: the game into a virtual X
# server nobody sees, a real short training run, the trainer offscreen. Minutes,
# not seconds, which is why it is its own task and not part of `poe pytest`.
test-app     = { cmd = "pytest -m e2e", deps = ["build"], help = "Run the application end-to-end tests (slow; needs xvfb for the game)" }
test-all     = { sequence = ["test", "test-release", "pytest"], help = "Run every test in Debug and Release" }

# --- Quality gates (C++) ---
format       = { cmd = "python -m tools.quality format", help = "clang-format all C++ sources" }
format-check = { cmd = "python -m tools.quality format-check", help = "Fail if any C++ is unformatted" }
tidy         = { cmd = "python -m tools.quality tidy", deps = ["build"], help = "clang-tidy core + app (warnings = errors)" }
coverage     = { cmd = "python -m tools.coverage 80", help = "Measure md::core line coverage; fail if below 80%" }
# Vulkan correctness, split by what it costs to ask. `vulkan-shaders` needs no
# GPU, display or build and runs in `check`; `vulkan-runtime` starts the debug
# game under the validation layer across every rendering scenario and runs in
# `check-all`. There is no allow-list behind either (docs/TESTING.md).
protocol       = { cmd = "python -m tools.protocol", help = "Regenerate the C++/Python copies of protocol.toml" }
protocol-check = { cmd = "python -m tools.protocol --check", help = "Fail if a generated protocol copy drifted from protocol.toml" }
vulkan-shaders = { cmd = "python -m tools.vulkan_check shaders", help = "spirv-val every embedded shader against the declared Vulkan target" }
vulkan-runtime = { cmd = "python -m tools.vulkan_check runtime", deps = ["build"], help = "Run the game under VK_LAYER_KHRONOS_validation + sync validation; any message fails" }
vulkan-check   = { sequence = ["vulkan-shaders", "vulkan-runtime"], help = "Both Vulkan gates (docs/TESTING.md)" }
deb          = { cmd = "cpack --config build/release/CPackConfig.cmake -B build/release -G DEB", deps = ["release"], help = "Build a .deb into build/release/ (needs dpkg-dev)" }
dmg          = { cmd = "cpack --config build/release/CPackConfig.cmake -B build/release -G DragNDrop", deps = ["release"], help = "Build a .dmg into build/release/ (macOS; needs macdeployqt)" }
version      = { cmd = "python -m tools.version", help = "Check CMakeLists/pyproject/changelog agree; `--dev semver|pep440|debian|filename` prints the nightly version" }
bump         = { cmd = "python -m tools.release", help = "Set the release version in all three files, then --commit / --tag / --push (docs/RELEASING.md)" }

# --- Quality gates (Python) ---
lint       = { cmd = "ruff check python tools", help = "Ruff lint the Python code" }
format-py  = { cmd = "ruff format python tools", help = "Ruff-format the Python code" }
fmt-py-chk = { cmd = "ruff format --check python tools", help = "Fail if any Python is unformatted" }
mypy       = { cmd = "mypy", help = "mypy strict" }
pyright    = { cmd = "pyright", help = "pyright strict" }
typecheck  = { sequence = ["mypy", "pyright"], help = "Static type-check (mypy + pyright, strict)" }

# --- Aggregate gates ---
# The same eleven stages the sequence used to run, but concurrently and each into
# its own log — see tools/gate.py for why that is a module rather than a longer
# list here. The stage list lives there; the tasks it names live here, so each is
# still defined exactly once and `poe tidy` on its own keeps working.
check = { cmd = "python -m tools.gate", help = "Full local CI gate — Debug + Release, tests, coverage ≥80%, zero warnings" }
check-serial = { sequence = [
  "format-check", "fmt-py-chk", "lint", "typecheck",
  "tidy", "protocol-check", "vulkan-shaders", "test", "test-release", "pytest", "coverage",
], help = "The gate one stage at a time — for bisecting a failure the parallel run interleaves" }

# The gate plus the application end-to-end suite. Separate from `check` because
# it is minutes rather than seconds and because the game half needs a virtual X
# server; CI runs this one, and it is what to run before a release.
check-all = { sequence = ["check", "vulkan-runtime", "test-app"], help = "The full gate plus Vulkan runtime validation and the application e2e suite" }

install-hooks = { cmd = "python -m tools.hooks install", help = "Install the git pre-commit quality hook" }

# ---- Ruff (Python lint + format) --------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# ---- mypy (strict static typing) --------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["python/missile_defense", "tools"]
strict = true

# torch is optional and has no MSYS2/MinGW wheel, so the training modules cannot
# be checked on every machine the rest of the tree is checked on.
[[tool.mypy.overrides]]
module = ["torch", "torch.*"]
ignore_missing_imports = true

# Pillow is a build-time dependency of one icon script and of nothing that ships,
# so it is not installed on every machine that runs the gate — the same treatment
# torch and PySide6 get above, and for the same reason.
[[tool.mypy.overrides]]
module = ["PIL", "PIL.*"]
ignore_missing_imports = true

# numpy is deliberately *not* overridden here. `missile_defense.sim.env` types its buffer
# contract with `numpy.typing`, and waving that through would silently drop the
# checking this project most depends on.
#
# It does constrain the environment: numpy >= 2.5 dropped Python 3.11 and writes
# PEP 695 `type` statements in its own stubs, which mypy parses only when
# targeting 3.12+ — so `python_version = "3.11"` above and a 2.5 numpy in the
# same virtualenv fail inside a stub file nothing here can edit. `numpy<2.5` is
# therefore a *typing* requirement, not only a runtime one, and
# `tools/bootstrap.py` and CI both install it.

[[tool.mypy.overrides]]
module = [
  "missile_defense.training.auxiliary",
  "missile_defense.training.ppo",
  "missile_defense.training.train",
]
ignore_errors = true

# The trainer is optional (LGPLv3, never a dependency of the game), so PySide6 is
# not installed on every machine that runs the gate — including CI. Its Qt-free
# half is checked everywhere; the two widget modules are checked where PySide6
# exists, with `pyright --pythonpath <interpreter that has it>`.
[[tool.mypy.overrides]]
module = ["PySide6", "PySide6.*"]
ignore_missing_imports = true

#
# **Every module under `missile_defense.ui` that imports PySide6 belongs in this list**, and
# `python/tests/test_typing_policy.py` fails if one is missing. It was a hand-kept
# enumeration for a while and drifted: `analysis`, `library`, `league` and
# `storage` arrived without being added, and because the failure only appears
# where PySide6 is *absent*, every developer machine stayed green while CI went
# red for days. The test is the fix; the list is just data now.
[[tool.mypy.overrides]]
module = [
  "missile_defense.ui.__main__",
  "missile_defense.ui.about",
  "missile_defense.ui.analysis",
  "missile_defense.ui.app",
  "missile_defense.ui.charts",
  "missile_defense.ui.config",
  "missile_defense.ui.forms",
  "missile_defense.ui.league",
  "missile_defense.ui.library",
  "missile_defense.ui.meters",
  "missile_defense.ui.model",
  "missile_defense.ui.runtime_dialog",
  "missile_defense.ui.storage",
]
ignore_errors = true

# ---- pyright (strict static typing) -----------------------------------------
[tool.pyright]
include = ["python/missile_defense", "tools"]
# `missile_defense` lives under python/, which is a source root for the package itself but
# not something pyright infers when checking a script in tools/ that imports it.
extraPaths = ["python"]
# See the mypy note above: without torch installed these degrade to Unknown, so
# they are checked on a machine that has it rather than pretended to be clean.
#
# mypy needs no such list — `ignore_missing_imports` on `torch.*` above covers
# it — but pyright has no per-module equivalent, so the files are named here and
# `tests/test_typing_policy.py` keeps the naming honest. `export_policy.py` was
# missing for weeks and nobody saw it: the errors only appear where torch is
# absent, and the one environment like that is CI.
ignore = [
  "python/missile_defense/training/auxiliary.py",
  "python/missile_defense/sim/export_policy.py",
  "python/missile_defense/training/ppo.py",
  "python/missile_defense/training/train.py",
  # Same reason, one layer out: PySide6 is optional, so the widgets are checked
  # on a machine that has it (`pyright --pythonpath ...`), not pretended clean.
  # Kept in step with the mypy list above by `tests/test_typing_policy.py`.
  "python/missile_defense/ui/__main__.py",
  "python/missile_defense/ui/about.py",
  "python/missile_defense/ui/analysis.py",
  "python/missile_defense/ui/app.py",
  "python/missile_defense/ui/charts.py",
  "python/missile_defense/ui/config.py",
  "python/missile_defense/ui/forms.py",
  "python/missile_defense/ui/league.py",
  "python/missile_defense/ui/library.py",
  "python/missile_defense/ui/meters.py",
  "python/missile_defense/ui/model.py",
  "python/missile_defense/ui/runtime_dialog.py",
  "python/missile_defense/ui/storage.py",
]
pythonVersion = "3.11"
typeCheckingMode = "strict"

# ---- pytest ------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["python/tests"]
# The root as well as the package, so `tools` — the developer tooling, which has
# discovery logic of its own — is testable rather than only type-checked.
pythonpath = ["python", "."]
addopts = "-q"
# e2e tests start real processes — the game, a training run, the trainer — so they
# are minutes rather than seconds and are not part of the inner loop.
# `poe pytest` stays fast; `poe test-e2e-app` runs these; the gate runs both.
markers = ["e2e: drives a shipped binary in its own process (slow)"]
